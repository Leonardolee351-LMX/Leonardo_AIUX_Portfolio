  <p class="meta">招聘页示例 · 这是岗位 JD，不是候选人简历</p>
  <h1>某消费电子公司 · 智能硬件产品经理</h1>
  <p>深圳 · 5 年经验 · 全职</p>
  <h2>职责</h2>
  <ul>
    <li>独立负责智能硬件 0→1 到量产上市，覆盖产品定义、硬件规格与 EVT/DVT/PVT</li>
    <li>基于用户研究与售后数据定义场景与优先级，输出可评审 PRD</li>
    <li>跨部门协同研发、结构、电子、供应链推进量产</li>
    <li>对 BOM 成本、体验与上市节奏做取舍</li>
    <li>结果需可公开复核，不接受无法溯源的转化率</li>
  </ul>
  <h2>要求</h2>
  <ul>
    <li>3 年以上硬件或消费电子产品经验</li>
    <li>能写规格书，能跟样机问题闭环</li>
  </ul>
